[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runlab-client"
version = "0.1.0"
description = "Python client for the RunLab research API: pre-registered A/B comparisons over seeds, verdicts with confidence intervals. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "omer-nachman" }]
dependencies = []

[project.scripts]
runlab = "runlab_client:main"

[project.urls]
Homepage = "https://github.com/omer-nachman/runlab-python"

[tool.setuptools.packages.find]
where = ["src"]
