name: publish

# Builds and publishes the two PyPI packages of this repo:
#
#   runlab-client  the client (this directory: src/runlab_client)
#   runlab         pypi-runlab/: no code, it depends on runlab-client, so
#                  `pip install runlab` installs the client
#
# build    always: PyPA build, `twine check --strict`, then a fresh venv installs
#          both wheels offline; runlab_client must import, and the runlab package
#          must contain no module
# publish  only when run by hand with publish=true, by PyPI trusted publishing
#          (this workflow's GitHub OIDC identity; no API token exists). One
#          environment per PyPI project, because PyPI takes one pending publisher
#          per (owner, repository, workflow, environment). skip-existing makes a
#          re-run harmless; a new release needs a new version number.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (off: build and smoke-test only)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false     # never cancel an upload half way

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build both packages and check their metadata
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build . --outdir dist/client
          python -m build pypi-runlab --outdir dist/runlab
          python -m twine check --strict dist/*/*

      - name: Fresh venv, both wheels offline, the runlab package has no module
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q --no-index --find-links dist/client --find-links dist/runlab runlab
          /tmp/v/bin/python -c "import runlab_client; print(runlab_client.__version__)"
          /tmp/v/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('runlab') is not None)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-client
          path: dist/client/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-runlab
          path: dist/runlab/
          if-no-files-found: error

  publish-client:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/runlab-client/
    permissions:
      id-token: write     # the OIDC token PyPI trusts; this job holds nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-client
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true

  publish-runlab:
    needs: publish-client   # it depends on runlab-client, so that goes up first
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-runlab
      url: https://pypi.org/project/runlab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-runlab
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true
